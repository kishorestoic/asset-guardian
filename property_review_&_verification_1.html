<main class="flex-1 p-8">
<div class="max-w-4xl mx-auto">
<div class="mb-8">
<h1 class="text-3xl font-bold text-black dark:text-white">Property Review</h1>
<p class="text-black/60 dark:text-white/60 mt-1">Review and verify property details before publishing.</p>
</div>
<div class="space-y-8">
<div class="bg-white dark:bg-background-dark rounded-lg p-6 shadow-sm border border-black/10 dark:border-white/10">
<h2 class="text-xl font-bold mb-6 text-black dark:text-white">Property Information</h2>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<div class="md:col-span-2">
<label class="block text-sm font-medium text-black/80 dark:text-white/80 mb-1" for="address">Address</label>
<input class="w-full bg-background-light dark:bg-black/20 border border-black/20 dark:border-white/20 rounded py-2 px-3 focus:outline-none focus:ring-2 focus:ring-primary" id="address" type="text" value="123 Ocean View Drive, Malibu, CA"/>
</div>
<div>
<label class="block text-sm font-medium text-black/80 dark:text-white/80 mb-1" for="property-type">Property Type</label>
<input class="w-full bg-background-light dark:bg-black/20 border border-black/20 dark:border-white/20 rounded py-2 px-3 focus:outline-none focus:ring-2 focus:ring-primary" id="property-type" type="text" value="Single Family Home"/>
</div>
<div>
<label class="block text-sm font-medium text-black/80 dark:text-white/80 mb-1" for="bedrooms">Bedrooms</label>
<input class="w-full bg-background-light dark:bg-black/20 border border-black/20 dark:border-white/20 rounded py-2 px-3 focus:outline-none focus:ring-2 focus:ring-primary" id="bedrooms" type="number" value="4"/>
</div>
<div>
<label class="block text-sm font-medium text-black/80 dark:text-white/80 mb-1" for="bathrooms">Bathrooms</label>
<input class="w-full bg-background-light dark:bg-black/20 border border-black/20 dark:border-white/20 rounded py-2 px-3 focus:outline-none focus:ring-2 focus:ring-primary" id="bathrooms" type="number" value="3"/>
</div>
<div>
<label class="block text-sm font-medium text-black/80 dark:text-white/80 mb-1" for="sqft">Square Footage</label>
<input class="w-full bg-background-light dark:bg-black/20 border border-black/20 dark:border-white/20 rounded py-2 px-3 focus:outline-none focus:ring-2 focus:ring-primary" id="sqft" type="number" value="3200"/>
</div>
<div class="md:col-span-2">
<label class="block text-sm font-medium text-black/80 dark:text-white/80 mb-1" for="description">Description</label>
<textarea class="w-full bg-background-light dark:bg-black/20 border border-black/20 dark:border-white/20 rounded py-2 px-3 focus:outline-none focus:ring-2 focus:ring-primary" id="description" rows="4">Stunning oceanfront property with panoramic views...</textarea>
</div>
</div>
</div>
<div class="bg-white dark:bg-background-dark rounded-lg p-6 shadow-sm border border-black/10 dark:border-white/10">
<h2 class="text-xl font-bold mb-6 text-black dark:text-white">Images</h2>
<div class="grid grid-cols-2 md:grid-cols-3 gap-4">
<div class="col-span-2 row-span-2 rounded-lg overflow-hidden"><img alt="Main property view" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCgWV5qS_3gU6-yOUxlntS_WwHslMbQd1CrlifWw02fD1bm0h-flwWO4ptQFtw7DUZmuIdt1k03g3cgsPBAhz_zTibgSlwbyoofwTHxLKrT4AHpsJqOcLvF654AmLCGAIgOwm_XBOR5ZnUH_IZud0RByqhN9BJFJuiT7BRX4nJGCSaO8U3N2j-8tura8Kaqi2KFmUPbUH8x065rwkeLJmqE8XAmzzmqkjYg1tOgYWIZgmv1Oyg6j4qxLmDnh3wXxYXG6_zo7WI07KkP"/></div>
<div class="rounded-lg overflow-hidden"><img alt="Property interior" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDvGRNArav7_Vi9-kmmkmYU3_k5bIhnNcHucXRec9dy7seW9YMkc-S5D6Oq9rnoBzMeat6hgfBGAry4ggqs-gFzE4fhaSwVqPAIzuFLmucT7UCRodzd9xaC8bJc0HlT4VncAaicC9bdDQDpc3ub3Iyu71z66NlIVoCGCCiSjjfJ_at_-_A8digvzL3PaYcDRpG0AwFbNG-xhNHIXcdKxYj5R0EbwZc8osKttNJuS4qqfE56NgKvHmF2dVj66mxhtWQXn-t_PvhdFmjp"/></div>
<div class="rounded-lg overflow-hidden"><img alt="Property exterior" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBMQwI1Qk601V_PcJfhe_Q3G-pKGeJbeMPLnupJXD7GM44lT0xFRV3ypdAJ4XSoFqX6mo3ANxDiCNlKPCkDaOPCCRzQQgYJujcwtbdVg0yRgCtAQ-bsMuAyjiDVqOU0RnKulJrlOFxrD9iZN39KXDW8_oeqYGtcdi_B0zyyQIkG0lkbOf4hWF4RMXrr6nWroJNm0HgKgsc0Jqi8giBLyPmI0aadZcf6pE1I_oFBN6wRWU6b_0jbKrzMqrZwFMkTBplCy7SVUcrXN2qx"/></div>
</div>
</div>
<div class="bg-white dark:bg-background-dark rounded-lg p-6 shadow-sm border border-black/10 dark:border-white/10">
<h2 class="text-xl font-bold mb-6 text-black dark:text-white">Ownership Documents</h2>
<div class="overflow-x-auto">
<table class="w-full text-left">
<thead class="border-b border-black/10 dark:border-white/10">
<tr>
<th class="p-3 text-sm font-semibold text-black/80 dark:text-white/80">Document Name</th>
<th class="p-3 text-sm font-semibold text-black/80 dark:text-white/80">Status</th>
<th class="p-3 text-sm font-semibold text-black/80 dark:text-white/80 text-right">Actions</th>
</tr>
</thead>
<tbody>
<tr class="border-b border-black/10 dark:border-white/10">
<td class="p-3">Deed of Ownership</td>
<td class="p-3">
<span class="inline-flex items-center px-2 py-1 text-xs font-medium rounded-full bg-primary/20 text-black dark:text-white">Verified</span>
</td>
<td class="p-3 text-right">
<button class="text-sm font-medium text-primary hover:underline">View Document</button>
</td>
</tr>
</tbody>
</table>
</div>
</div>
<div class="bg-white dark:bg-background-dark rounded-lg p-6 shadow-sm border border-black/10 dark:border-white/10">
<h2 class="text-xl font-bold mb-6 text-black dark:text-white">Verification Status</h2>
<div class="flex flex-wrap gap-4 items-center">
<div class="flex items-center">
<input class="form-radio h-4 w-4 text-primary bg-background-light dark:bg-black/20 border-black/30 dark:border-white/30 focus:ring-primary" id="pending" name="status" type="radio"/>
<label class="ml-2 block text-sm text-black/80 dark:text-white/80" for="pending">Pending</label>
</div>
<div class="flex items-center">
<input checked="" class="form-radio h-4 w-4 text-primary bg-background-light dark:bg-black/20 border-black/30 dark:border-white/30 focus:ring-primary" id="approved" name="status" type="radio"/>
<label class="ml-2 block text-sm text-black/80 dark:text-white/80" for="approved">Approved</label>
</div>
<div class="flex items-center">
<input class="form-radio h-4 w-4 text-primary bg-background-light dark:bg-black/20 border-black/30 dark:border-white/30 focus:ring-primary" id="rejected" name="status" type="radio"/>
<label class="ml-2 block text-sm text-black/80 dark:text-white/80" for="rejected">Rejected</label>
</div>
</div>
<div class="mt-6">
<label class="block text-sm font-medium text-black/80 dark:text-white/80 mb-1" for="rejection-reason">Rejection Reason (Required if Rejected)</label>
<textarea class="w-full bg-background-light dark:bg-black/20 border border-black/20 dark:border-white/20 rounded py-2 px-3 focus:outline-none focus:ring-2 focus:ring-primary" id="rejection-reason" placeholder="Enter reason for rejection..." rows="3"></textarea>
</div>
</div>
<div class="flex justify-end gap-4 pt-4">
<button class="px-6 py-2 rounded-lg text-sm font-semibold border border-black/20 dark:border-white/20 text-black/80 dark:text-white/80 hover:bg-black/5 dark:hover:bg-white/5">Flag Property</button>
<button class="px-6 py-2 rounded-lg text-sm font-semibold bg-primary text-black">Save Changes</button>
</div>
</div>
</div>
</main>
</div>

</body></html>
