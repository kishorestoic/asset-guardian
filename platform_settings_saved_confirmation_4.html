<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Confirmation Message</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#17cf17",
                        "background-light": "#f6f8f6",
                        "background-dark": "#112111",
                    },
                    fontFamily: {
                        "display": ["Public Sans"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="flex items-center justify-center min-h-screen">
<div class="bg-white dark:bg-background-dark shadow-lg rounded-lg p-6 max-w-sm w-full mx-4 border border-primary/20 dark:border-primary/30">
<div class="flex items-center space-x-4">
<div class="flex-shrink-0">
<div class="bg-primary/20 dark:bg-primary/30 rounded-full p-2">
<span class="material-symbols-outlined text-primary text-2xl">
                            check_circle
                        </span>
</div>
</div>
<div class="flex-1">
<p class="text-gray-800 dark:text-gray-200 font-semibold">Platform settings saved successfully!</p>
</div>
<button class="text-gray-400 dark:text-gray-500 hover:text-gray-600 dark:hover:text-gray-300 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary/50 rounded-full p-1" type="button">
<span class="material-symbols-outlined">
                        close
                    </span>
</button>
</div>
</div>
</div>

</body></html>
