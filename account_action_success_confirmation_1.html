<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>User Suspended</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;700;900&amp;display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#17cf17",
                        "background-light": "#f6f8f6",
                        "background-dark": "#112111",
                    },
                    fontFamily: {
                        "display": ["Public Sans"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings:
                'FILL' 1,
                'wght' 400,
                'GRAD' 0,
                'opsz' 24
        }
    </style>
</head>

<body class="bg-background-light dark:bg-background-dark font-display">
    <div class="flex items-center justify-center min-h-screen">
        <div
            class="bg-background-light dark:bg-background-dark shadow-lg rounded-xl p-6 md:p-8 w-full max-w-md text-center border border-primary/20 dark:border-primary/30">
            <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-primary/10 mb-4">
                <span class="material-symbols-outlined text-primary text-4xl">
                    check_circle
                </span>
            </div>
            <h1 class="text-xl md:text-2xl font-bold text-black dark:text-white">User Suspended</h1>
            <p class="text-sm md:text-base text-black/60 dark:text-white/60 mt-2">
                The user account for 'sophia.clark@email.com' has been successfully suspended. They will not be able to
                access their account until it is reactivated.
            </p>
            <div class="mt-6">
                <button
                    class="w-full bg-primary text-white rounded-lg px-4 py-2.5 text-sm font-bold shadow-sm hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary focus:ring-offset-background-light dark:focus:ring-offset-background-dark">
                    Done
                </button>
            </div>
        </div>
    </div>

</body>

</html>
