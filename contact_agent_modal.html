<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Contact Agent Modal</title>
<link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1193d4",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101c22",
                        "surface-light": "#ffffff",
                        "surface-dark": "#1a2a33",
                        "text-light": "#111618",
                        "text-dark": "#e3e8eb",
                        "subtle-light": "#617c89",
                        "subtle-dark": "#a0b1bac2",
                        "border-light": "#dbe2e6",
                        "border-dark": "#32434d"
                    },
                    fontFamily: {
                        "display": ["Public Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "0.75rem",
                        "xl": "1rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
</head>
<body class="font-display bg-background-light dark:bg-background-dark flex items-center justify-center min-h-screen">
<div aria-hidden="true" class="fixed inset-0 bg-black/30"></div>
<div class="relative w-full max-w-lg m-4">
<div class="bg-surface-light dark:bg-surface-dark rounded-xl shadow-2xl overflow-hidden">
<div class="p-8">
<div class="text-center mb-6">
<h2 class="text-2xl font-bold text-text-light dark:text-text-dark">Contact Agent</h2>
<p class="text-subtle-light dark:text-subtle-dark mt-1">We'll connect you with the listing agent for this property.</p>
</div>
<form action="#" class="space-y-6" method="POST">
<div>
<label class="block text-sm font-medium text-text-light dark:text-text-dark" for="name">Name</label>
<div class="mt-1">
<input class="form-input w-full rounded-lg bg-background-light dark:bg-background-dark border-border-light dark:border-border-dark text-text-light dark:text-text-dark placeholder:text-subtle-light dark:placeholder:text-subtle-dark focus:ring-primary focus:border-primary" id="name" name="name" placeholder="Enter your full name" type="text"/>
</div>
</div>
<div>
<label class="block text-sm font-medium text-text-light dark:text-text-dark" for="email">Email</label>
<div class="mt-1">
<input class="form-input w-full rounded-lg bg-background-light dark:bg-background-dark border-border-light dark:border-border-dark text-text-light dark:text-text-dark placeholder:text-subtle-light dark:placeholder:text-subtle-dark focus:ring-primary focus:border-primary" id="email" name="email" placeholder="you@example.com" type="email"/>
</div>
</div>
<div>
<label class="block text-sm font-medium text-text-light dark:text-text-dark" for="phone">Phone Number</label>
<div class="mt-1">
<input class="form-input w-full rounded-lg bg-background-light dark:bg-background-dark border-border-light dark:border-border-dark text-text-light dark:text-text-dark placeholder:text-subtle-light dark:placeholder:text-subtle-dark focus:ring-primary focus:border-primary" id="phone" name="phone" placeholder="(123) 456-7890" type="tel"/>
</div>
</div>
<div>
<label class="block text-sm font-medium text-text-light dark:text-text-dark" for="message">Message</label>
<div class="mt-1">
<textarea class="form-textarea w-full rounded-lg bg-background-light dark:bg-background-dark border-border-light dark:border-border-dark text-text-light dark:text-text-dark placeholder:text-subtle-light dark:placeholder:text-subtle-dark focus:ring-primary focus:border-primary" id="message" name="message" placeholder="I'm interested in this property and would like to schedule a tour." rows="4"></textarea>
</div>
</div>
<div>
<button class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-semibold text-white bg-primary hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary focus:ring-offset-surface-light dark:focus:ring-offset-surface-dark transition-colors" type="submit">
                            Send Message
                        </button>
</div>
</form>
</div>
<div class="px-8 py-4 bg-background-light dark:bg-background-dark border-t border-border-light dark:border-border-dark text-center">
<p class="text-xs text-subtle-light dark:text-subtle-dark">By clicking Send Message, you agree to our Terms of Use and Privacy Policy.</p>
</div>
</div>
</div>

</body></html>
