<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Thank You Confirmation</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#50da0b",
              "background-light": "#f6f8f5",
              "background-dark": "#162210",
              "content-light": "#162210",
              "content-dark": "#f6f8f5",
            },
            fontFamily: {
              "display": ["Public Sans"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display flex items-center justify-center min-h-screen">
<div class="bg-background-light dark:bg-background-dark shadow-xl rounded-lg p-8 max-w-md w-full border border-primary/20 dark:border-primary/30">
<div class="flex flex-col items-center text-center">
<div class="bg-primary rounded-full p-3 mb-4">
<span class="material-symbols-outlined text-background-dark text-4xl">
                    check
                </span>
</div>
<h2 class="text-2xl font-bold text-content-light dark:text-content-dark mb-2">Thank you!</h2>
<p class="text-content-light/80 dark:text-content-dark/80 mb-6">Your message has been sent to the agent. They will respond to you shortly.</p>
<button class="bg-primary text-background-dark font-bold py-2 px-6 rounded-lg hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:ring-offset-2 focus:ring-offset-background-light dark:focus:ring-offset-background-dark transition-colors duration-300">
                Close
            </button>
</div>
</div>

</body></html>
