<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Confirm Bulk Action</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f20d0d",
                        "background-light": "#f8f5f5",
                        "background-dark": "#221010",
                    },
                    fontFamily: {
                        "display": ["Public Sans"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="flex items-center justify-center min-h-screen">
<div class="bg-background-light dark:bg-background-dark shadow-xl rounded-lg p-8 max-w-md w-full border border-primary/20 dark:border-primary/30">
<div class="text-center">
<div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-primary/10 dark:bg-primary/20">
<span class="material-symbols-outlined text-primary text-3xl">
                        warning
                    </span>
</div>
<h3 class="mt-5 text-xl font-semibold text-gray-900 dark:text-white">
                    Confirm Bulk Deletion
                </h3>
<div class="mt-2 px-4">
<p class="text-sm text-gray-600 dark:text-gray-300">
                        Are you sure you want to delete <strong>3 selected listings</strong>? This action is irreversible and the listings will be permanently removed.
                    </p>
</div>
</div>
<div class="mt-8 space-y-4">
<div class="border border-gray-200 dark:border-gray-700 rounded p-3">
<p class="text-sm font-medium text-gray-800 dark:text-gray-200">Affected Listings:</p>
<ul class="mt-2 list-disc list-inside text-sm text-gray-600 dark:text-gray-400 space-y-1">
<li>123 Maple Street, Apt 4B</li>
<li>789 Ocean Avenue, Penthouse</li>
<li>456 Pine Lane, Unit 12</li>
</ul>
</div>
</div>
<div class="mt-8 grid grid-cols-1 sm:grid-cols-2 gap-4">
<button class="inline-flex w-full justify-center rounded-md border border-transparent bg-primary/20 dark:bg-primary/30 px-4 py-2 text-base font-medium text-primary hover:bg-primary/30 dark:hover:bg-primary/40 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 dark:focus:ring-offset-background-dark" type="button">
                    Cancel
                </button>
<button class="inline-flex w-full justify-center rounded-md border border-transparent bg-primary px-4 py-2 text-base font-medium text-white shadow-sm hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 dark:focus:ring-offset-background-dark" type="button">
                    Delete Listings
                </button>
</div>
</div>
</div>

</body></html>
